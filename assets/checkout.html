<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Checkout - Soak Ops</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root {
    --lime: #C8FF00;
    --pink: #E5007D;
    --dark: #0D0D1A;
    --gray: #6B7280;
    --line: rgba(0,0,0,.12);
    --bg: #FFFFFF;
  }
  body { margin: 0; font-family: Inter, sans-serif; color: var(--dark); background: var(--bg); }
  nav {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,.95);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px;
  }
  .logo { color: var(--dark); text-decoration: none; font-weight: 900; letter-spacing: -.03em; }
  .logo span { color: var(--lime); }
  .wrap {
    max-width: 1100px; margin: 0 auto; padding: 28px 20px 56px;
    display: grid; grid-template-columns: 1fr 360px; gap: 28px;
  }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .panel { border: 1px solid var(--line); padding: 22px; }
  h1 { margin: 0 0 6px; font-size: 34px; line-height: 1; letter-spacing: -.03em; }
  .sub { margin: 0 0 22px; color: var(--gray); font-size: 14px; }
  .btn {
    width: 100%; border: none; background: var(--lime); color: var(--dark);
    font-weight: 900; text-transform: uppercase; letter-spacing: .07em;
    padding: 14px; cursor: pointer; font-size: 15px;
  }
  .btn:hover { opacity: .88; }
  .item { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: none; }
  .name { font-size: 14px; font-weight: 700; }
  .qty { font-size: 12px; color: var(--gray); margin-top: 2px; }
  .price { font-size: 14px; font-weight: 800; }
  .sum { display: flex; justify-content: space-between; margin-top: 10px; font-size: 14px; }
  .sum.total { font-size: 20px; font-weight: 900; padding-top: 12px; border-top: 1px solid var(--line); margin-top: 14px; }
  .empty { color: var(--gray); font-size: 14px; }
  .note { margin-top: 10px; color: var(--gray); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<nav>
  <a class='logo' href='/'>SOAK <span>OPS</span></a>
  <a href='/cart?v=20260605'>Back to Cart</a>
</nav>

<div class="wrap">
  <section class="panel">
    <h1>CHECKOUT</h1>
    <p class="sub">You'll complete your order securely on the next page.</p>
    <button class="btn" id="shopify-checkout-btn" onclick="goToShopify()">Proceed to Secure Checkout →</button>
    <p class="note">🔒 Powered by Shopify — secure payment processing</p>
  </section>

  <aside class="panel">
    <h2 style="margin:0 0 12px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;">Order Summary</h2>
    <div id="items"></div>
    <div class="sum"><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
    <div class="sum"><span>Shipping</span><strong>FREE</strong></div>
    <div class="sum total"><span>Total</span><span id="total">$0.00</span></div>
  </aside>
</div>

<script src="products.js"></script>
<script>
function getCart() {
  try {
    const raw = JSON.parse(localStorage.getItem('soakops-cart') || '[]');
    if (!Array.isArray(raw)) return [];
    return raw.map(i => {
      const id = parseInt(i.id, 10);
      const prod = PRODUCTS.find(p => p.id === id);
      return {
        id,
        name: String((prod && prod.name) || i.name || ''),
        price: Number((prod && prod.price) ?? i.price) || 0,
        qty: Math.max(1, parseInt(i.qty, 10) || 1),
        variantId: prod && prod.variants && prod.variants.length ? prod.variants[0].id : null
      };
    }).filter(i => !isNaN(i.id));
  } catch { return []; }
}

function money(n) { return '$' + Number(n || 0).toFixed(2); }

function renderOrder() {
  const cart = getCart();
  const box = document.getElementById('items');

  if (!cart.length) {
    box.innerHTML = '<p class="empty">Your cart is empty. <a href="/">Return to shop</a>.</p>';
    document.getElementById('subtotal').textContent = '$0.00';
    document.getElementById('total').textContent = '$0.00';
    document.getElementById('shopify-checkout-btn').disabled = true;
    return;
  }

  let subtotal = 0;
  box.innerHTML = cart.map(i => {
    const line = (Number(i.price) || 0) * (Number(i.qty) || 1);
    subtotal += line;
    return '<div class="item">'
      + '<div><div class="name">' + i.name + '</div><div class="qty">Qty ' + i.qty + '</div></div>'
      + '<div class="price">' + money(line) + '</div>'
      + '</div>';
  }).join('');

  document.getElementById('subtotal').textContent = money(subtotal);
  document.getElementById('total').textContent = money(subtotal);
}

function goToShopify() {
  const cart = getCart();
  if (!cart.length) {
    alert('Your cart is empty.');
    return;
  }

  // Build Shopify cart URL: /cart/variantId:qty,variantId:qty
  const items = cart
    .filter(i => i.variantId)
    .map(i => i.variantId + ':' + i.qty)
    .join(',');

  if (!items) {
    alert('Unable to build cart. Please try adding items again.');
    return;
  }

  // Send directly to Shopify checkout (avoids soakops.com domain loop)
  const shopifyUrl = 'https://0u1gd1-9z.myshopify.com/cart/' + items;
  window.location.href = shopifyUrl;
}

renderOrder();
</script>
</body>
</html>
